name: Build Kaiyue Mail for macOS

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
            arch: arm64
            intel: ''
          - os: macos-26-intel
            arch: x64
            intel: '1'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          OVERRIDE_TO_INTEL: ${{ matrix.intel }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build unsigned application archive
        run: npm run build
        env:
          KAIYUE_SOURCE_REVISION: ${{ github.sha }}
          OVERRIDE_TO_INTEL: ${{ matrix.intel }}

      - name: Upload unsigned macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiyueMail-macOS-${{ matrix.arch }}-${{ github.run_number }}
          if-no-files-found: error
          path: app/dist/KaiyueMail.zip
